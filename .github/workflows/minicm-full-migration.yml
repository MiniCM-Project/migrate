name: Migrate All MiniCM Repositories to MiniCM-Project (All Branches)

on:
  workflow_dispatch:

jobs:
  migrate_minicm_batch_1:
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo & GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y git-filter-repo python3-git gh

      - name: Authenticate GitHub CLI
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "$GH_PAT" | gh auth login --with-token

      - name: Run Migration (Batch 1)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          repos=(
            "MiniCM/android_frameworks_base|MiniCM-Project/android_frameworks_base"
            "MiniCM/android_external_webkit|MiniCM-Project/android_external_webkit"
            "MiniCM/android_packages_apps_CMParts|MiniCM-Project/android_packages_apps_CMParts"
            "MiniCM/android_packages_apps_Torch|MiniCM-Project/android_packages_apps_Torch"
            "MiniCM/android_packages_apps_Camera|MiniCM-Project/android_packages_apps_Camera"
            "MiniCM/android_system_vold|MiniCM-Project/android_system_vold"
            "MiniCM/android_vendor_cyanogen|MiniCM-Project/android_vendor_cyanogen"
            "MiniCM/android_device_semc_robyn|MiniCM-Project/android_device_semc_robyn"
            "MiniCM/android_bootable_recovery|MiniCM-Project/android_bootable_recovery"
            "MiniCM/android_device_semc_shakira|MiniCM-Project/android_device_semc_shakira"
            "MiniCM/android_packages_apps_FileManager|MiniCM-Project/android_packages_apps_FileManager"
            "MiniCM/android_device_semc_mimmi|MiniCM-Project/android_device_semc_mimmi"
            "MiniCM/android_device_semc_msm7x27-common|MiniCM-Project/android_device_semc_msm7x27-common"
            "MiniCM/android_vendor_semc|MiniCM-Project/android_vendor_semc"
            "MiniCM/android_packages_apps_Phone|MiniCM-Project/android_packages_apps_Phone"
          )

          for item in "${repos[@]}"; do
            IFS="|" read -r source_repo target_repo <<< "$item"
            repo_name=$(basename "$target_repo")

            echo "=================================================="
            echo "Migrating: $source_repo -> $target_repo"
            echo "=================================================="

            desc=$(gh api "repos/$source_repo" --jq '.description // ""' 2>/dev/null || echo "")

            if ! gh repo view "$target_repo" >/dev/null 2>&1; then
              if [ -n "$desc" ]; then
                gh repo create "$target_repo" --public --description "$desc" || true
              else
                gh repo create "$target_repo" --public || true
              fi
              sleep 15
            else
              echo "Repository already exists."
            fi

            git clone --mirror "https://x-access-token:${GH_PAT}@github.com/$source_repo.git" "$repo_name"
            cd "$repo_name"

            echo "Rewriting history across all refs..."
            git filter-repo --name-callback 'return b"nobodyAtall-code"' --email-callback 'return b"hashyofficial@gmail.com"' --force

            git config http.postBuffer 524288000
            git config http.maxRequestBuffer 100M
            git config core.compression 0

            git remote remove origin || true
            git remote add origin "https://x-access-token:${GH_PAT}@github.com/$target_repo.git"
            
            echo "Pushing valid branches and tags..."
            git push origin '+refs/heads/*:refs/heads/*'
            git push origin '+refs/tags/*:refs/tags/*'

            default_branch=$(gh api "repos/$target_repo" --jq '.default_branch' 2>/dev/null || echo "main")
            if [ "$default_branch" != "main" ] && git ls-remote --heads origin main | grep -q main; then
              gh repo edit "$target_repo" --default-branch "main" || true
            fi

            cd ..
            rm -rf "$repo_name"

            echo "Completed $target_repo. Waiting 4 minutes (240 seconds)..."
            sleep 240
          done

