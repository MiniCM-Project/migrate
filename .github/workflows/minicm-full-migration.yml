name: Resume MiniCM Migration (Batch 3 Remaining)

on:
  workflow_dispatch:

jobs:
  migrate_remaining_batch_3:
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo & GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y git-filter-repo python3-git gh

      - name: Authenticate GitHub CLI
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "$GH_PAT" | gh auth login --with-token

      - name: Run Migration for Remaining Batch 3 Repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          repos=(
            "MiniCM/android_system_netd|MiniCM-Project/android_system_netd"
            "MiniCM/android_vendor_cm|MiniCM-Project/android_vendor_cm"
            "MiniCM/android_frameworks_av|MiniCM-Project/android_frameworks_av"
            "MiniCM/android_frameworks_native|MiniCM-Project/android_frameworks_native"
            "MiniCM/android_hardware_ti_wlan|MiniCM-Project/android_hardware_ti_wlan"
            "MiniCM/android_hardware_libhardware|MiniCM-Project/android_hardware_libhardware"
            "MiniCM/android_packages_apps_LegacyCamera|MiniCM-Project/android_packages_apps_LegacyCamera"
            "MiniCM/android_packages_apps_Gallery2|MiniCM-Project/android_packages_apps_Gallery2"
            "MiniCM/android_packages_apps_CMUpdater|MiniCM-Project/android_packages_apps_CMUpdater"
            "MiniCM/android_hardware_ti_fmradio|MiniCM-Project/android_hardware_ti_fmradio"
            "MiniCM/android_bionic|MiniCM-Project/android_bionic"
          )

          for item in "${repos[@]}"; do
            IFS="|" read -r source_repo target_repo <<< "$item"
            repo_name=$(basename "$target_repo")

            echo "=================================================="
            echo "Migrating: $source_repo -> $target_repo"
            echo "=================================================="

            desc=$(gh api "repos/$source_repo" --jq '.description // ""' 2>/dev/null || echo "")

            if ! gh repo view "$target_repo" >/dev/null 2>&1; then
              if [ -n "$desc" ]; then
                gh repo create "$target_repo" --public --description "$desc" || true
              else
                gh repo create "$target_repo" --public || true
              fi
              sleep 15
            else
              echo "Repository already exists."
            fi

            git clone --mirror "https://x-access-token:${GH_PAT}@github.com/$source_repo.git" "$repo_name"
            cd "$repo_name"

            echo "Stripping oversized blobs (>50M) and rewriting history..."
            git filter-repo --strip-blobs-bigger-than 50M --name-callback 'return b"nobodyAtall-code"' --email-callback 'return b"hashyofficial@gmail.com"' --force

            echo "Running aggressive garbage collection..."
            git config pack.windowMemory 10m
            git config pack.packSizeLimit 1g
            git gc --aggressive --prune=now

            git config http.postBuffer 524288000
            git config http.maxRequestBuffer 100M

            git remote remove origin || true
            git remote add origin "https://x-access-token:${GH_PAT}@github.com/$target_repo.git"
            
            echo "Pushing branches individually..."
            while read -r branch; do
              if [ -n "$branch" ]; then
                echo "Pushing branch: $branch"
                git push origin "refs/heads/$branch:refs/heads/$branch" --force || true
              fi
            done < <(git for-each-ref --format='%(refname:short)' refs/heads/)

            echo "Pushing tags..."
            git push origin --tags --force || true

            # Automatically find branch with the most commits to set as default
            best_branch="main"
            max_commits=-1
            while read -r sha ref; do
              if [ -n "$sha" ] && [ -n "$ref" ]; then
                count=$(git rev-list --count "$sha" 2>/dev/null || echo 0)
                if [ "$count" -gt "$max_commits" ]; then
                  max_commits=$count
                  best_branch="$ref"
                fi
              fi
            done < <(git for-each-ref --format='%(objectname) %(refname:short)' refs/heads/)

            echo "Setting default branch to '$best_branch' ($max_commits commits)..."
            gh repo edit "$target_repo" --default-branch "$best_branch" || true

            cd ..
            rm -rf "$repo_name"

            echo "Completed $target_repo. Waiting 4 minutes (240 seconds)..."
            sleep 240
          done
